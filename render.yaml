services:
  - type: web
    name: ems-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && node database/seed.js && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ems-db
          property: connectionString

databases:
  - name: ems-db
    plan: free
    postgresMajorVersion: 15
