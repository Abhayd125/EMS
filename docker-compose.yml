version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ems_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ems
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/ems?schema=public
      - PORT=5000
      - JWT_SECRET=supersecuresecret12345
      - NODE_ENV=production
    depends_on:
      - db

volumes:
  postgres_data:
